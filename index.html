<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安全作業通報入口</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --border-hover: rgba(0,0,0,0.25);
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-muted: #9a9994;
      --icon-blue-bg: #E6F1FB;
      --icon-blue-fg: #185FA5;
      --icon-amber-bg: #FAEEDA;
      --icon-amber-fg: #854F0B;
      --icon-red-bg: #FCEBEB;
      --icon-red-fg: #A32D2D;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --surface: #2a2a27;
        --border: rgba(255,255,255,0.1);
        --border-hover: rgba(255,255,255,0.25);
        --text-primary: #f0ede6;
        --text-secondary: #b4b2a9;
        --text-muted: #6e6c68;
        --icon-blue-bg: #0C447C;
        --icon-blue-fg: #B5D4F4;
        --icon-amber-bg: #633806;
        --icon-amber-fg: #FAC775;
        --icon-red-bg: #791F1F;
        --icon-red-fg: #F7C1C1;
      }
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 26px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem 1.25rem;
      text-decoration: none;
      display: block;
      transition: border-color 0.15s, transform 0.1s;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .card:active {
      transform: translateY(0);
    }

    .icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .icon-wrap svg { width: 24px; height: 24px; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .icon-blue { background: var(--icon-blue-bg); }
    .icon-blue svg { stroke: var(--icon-blue-fg); }
    .icon-amber { background: var(--icon-amber-bg); }
    .icon-amber svg { stroke: var(--icon-amber-fg); }
    .icon-red { background: var(--icon-red-bg); }
    .icon-red svg { stroke: var(--icon-red-fg); }

    .card-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 1.1rem;
    }

    .card-arrow {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-arrow svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .divider { height: 0.5px; background: var(--border); margin: 2.5rem 0 1.25rem; }

    .footer { font-size: 12px; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">興達電廠</p>
    <h1>安全作業通報入口</h1>
    <p class="sub">請依作業類型選擇對應系統進行通報</p>

    <div class="cards">

      <a class="card" href="https://tbm-ky.pages.dev/" target="_blank" rel="noopener">
        <div class="icon-wrap icon-blue">
          <svg viewBox="0 0 24 24">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
            <path d="M9 12h6M9 16h4"/>
          </svg>
        </div>
        <p class="card-label">每日會議</p>
        <p class="card-title">TBM-KY 通報系統</p>
        <p class="card-desc">填寫工具箱會議通報，上傳作業前檢點表及相關許可證</p>
        <div class="card-arrow">
          <span>前往填寫</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </a>

      <a class="card" href="https://confined-space.pages.dev/" target="_blank" rel="noopener">
        <div class="icon-wrap icon-amber">
          <svg viewBox="0 0 24 24">
            <path d="M12 9v4M12 17h.01"/>
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          </svg>
        </div>
        <p class="card-label">特殊作業</p>
        <p class="card-title">局限空間作業通報</p>
        <p class="card-desc">局限空間作業前後通報，上傳許可證與作業後確認文件</p>
        <div class="card-arrow">
          <span>前往填寫</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </a>

      <a class="card" href="https://fire-management2.pages.dev/" target="_blank" rel="noopener">
        <div class="icon-wrap icon-red">
          <svg viewBox="0 0 24 24">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
        </div>
        <p class="card-label">動火管理</p>
        <p class="card-title">動火管理系統</p>
        <p class="card-desc">動火作業前中後通報，記錄氣體偵測、防護設備與結束確認</p>
        <div class="card-arrow">
          <span>前往填寫</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </a>

    </div>

    <div class="divider"></div>
    <p class="footer">如有多項作業，請分別至對應系統完成通報</p>
  </div>
</body>
</html>
